spring:
  application:
    name: backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/logindb}
    username: ${DB_USERNAME:loginuser}
    password: ${DB_PASSWORD:change_me}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # El esquema lo gestiona Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never

app:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      issuer: login-api
      expiration: 1h
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
